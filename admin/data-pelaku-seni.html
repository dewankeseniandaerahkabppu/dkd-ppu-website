<!doctype html>
<html lang="id">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Data Pelaku Seni & Budaya - Admin DKD PPU</title>

<style>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5ead5;
color:#0b3028;
}

.header{
background:#0b3028;
color:#e7bd62;
padding:25px;
font-size:28px;
font-weight:bold;
border-bottom:3px solid #c99a3d;
}

.container{
padding:30px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px #0002;
}

button{
background:#0b3028;
color:white;
border:0;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
margin-right:10px;
}

button:hover{
background:#174b3b;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#0b3028;
color:#e7bd62;
}

td,th{
padding:10px;
border:1px solid #ddd;
}

</style>

</head>


<body>


<div class="header">

DATA PELAKU SENI & BUDAYA

<br>

<small>
Admin Dewan Kesenian Daerah PPU
</small>

</div>



<div class="container">

<div class="card">


<button onclick="downloadCSV()">
Download Excel / CSV
</button>


<button onclick="downloadPDF()">
Download PDF
</button>



<table id="tabel">

<thead>

<tr>

<th>No</th>
<th>Nomor Pendataan</th>
<th>Nama Individu / Group</th>
<th>Kategori</th>
<th>Jenis Pelaku</th>
<th>Bidang Seni</th>
<th>Kecamatan</th>
<th>Desa/Kelurahan</th>
<th>Status</th>

</tr>

</thead>


<tbody id="data">

<tr>
<td colspan="9">
Memuat data...
</td>
</tr>

</tbody>


</table>


</div>

</div>



<script>


let dataPelaku=[];



fetch("/content/pendataan.json")

.then(res=>res.json())

.then(result=>{

dataPelaku=result.data || [];

tampilkanData();

})

.catch(()=>{

document.getElementById("data").innerHTML=

"<tr><td colspan='9'>Data belum tersedia</td></tr>";

});





function tampilkanData(){


let html="";


dataPelaku.forEach((item,index)=>{


html+=`

<tr>

<td>${index+1}</td>

<td>${item.id || "-"}</td>

<td>${item.nama || "-"}</td>

<td>${item.kategori || "-"}</td>

<td>${item.jenis || "-"}</td>

<td>${item.bidang || "-"}</td>

<td>${item.kecamatan || "-"}</td>

<td>${item.desa || "-"}</td>

<td>${item.status || "-"}</td>

</tr>

`;

});


document.getElementById("data").innerHTML=html;


}




function downloadCSV(){


let csv=
"No,NOMOR,NAMA,KATEGORI,JENIS,BIDANG,KECAMATAN,DESA,STATUS\n";


dataPelaku.forEach((x,i)=>{


csv+=`${i+1},${x.id},${x.nama},${x.kategori},${x.jenis},${x.bidang},${x.kecamatan},${x.desa},${x.status}\n`;


});


let blob=new Blob([csv],{
type:"text/csv"
});


let url=URL.createObjectURL(blob);


let a=document.createElement("a");

a.href=url;

a.download="Data-Pelaku-Seni-DKD-PPU.csv";

a.click();


}




function downloadPDF(){


let isi=
`
DEWAN KESENIAN DAERAH
KABUPATEN PENAJAM PASER UTARA

DATA PELAKU SENI & BUDAYA

Jumlah Data : ${dataPelaku.length}

`;



dataPelaku.forEach((x,i)=>{

isi+=`

${i+1}.
${x.nama}
Kategori : ${x.kategori}
Jenis : ${x.jenis}
Bidang : ${x.bidang}
Kecamatan : ${x.kecamatan}
Desa : ${x.desa}
Status : ${x.status}

`;

});


let blob=new Blob([isi],{
type:"application/pdf"
});


let url=URL.createObjectURL(blob);


let a=document.createElement("a");

a.href=url;

a.download="Data-Pelaku-Seni-DKD-PPU.pdf";

a.click();


}



</script>


</body>

</html>
