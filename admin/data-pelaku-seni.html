<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Data Pelaku Seni & Budaya - Admin DKD PPU</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5ead2;
      color: #18332d;
    }

    header {
      background: #0b3028;
      color: #f5ead2;
      padding: 24px 20px;
      border-bottom: 4px solid #c99a3d;
    }

    header .wrap {
      max-width: 1400px;
      margin: auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 14px;
      color: #e7bd62;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      margin-top: 7px;
      color: #d8d0bd;
      font-size: 14px;
    }

    main {
      max-width: 1400px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .info {
      background: white;
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.07);
    }

    .info strong {
      color: #0b3028;
    }

    .status-message {
      margin-top: 10px;
      font-size: 14px;
    }

    .loading {
      color: #197c78;
      font-weight: bold;
    }

    .error {
      color: #9f302c;
      font-weight: bold;
    }

    .table-box {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,.07);
    }

    .table-scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 1050px;
      border-collapse: collapse;
    }

    th {
      background: #0b3028;
      color: #f5ead2;
      padding: 14px 12px;
      text-align: left;
      font-size: 13px;
      white-space: nowrap;
    }

    td {
      padding: 13px 12px;
      border-bottom: 1px solid #eee6d6;
      font-size: 13px;
      vertical-align: top;
    }

    tr:hover td {
      background: #faf7ef;
    }

    .id {
      font-weight: bold;
      color: #197c78;
      white-space: nowrap;
    }

    .name {
      font-weight: bold;
      color: #18332d;
    }

    .badge {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
    }

    .menunggu {
      background: #fff0c8;
      color: #795700;
    }

    .terverifikasi {
      background: #d9eee8;
      color: #176458;
    }

    .dipublikasikan {
      background: #d8e8f5;
      color: #20577a;
    }

    .ditolak {
      background: #f5d9d7;
      color: #8a2925;
    }

    .kosong {
      text-align: center;
      padding: 40px 20px;
      color: #777;
    }

    @media (max-width: 600px) {
      header {
        padding: 20px 15px;
      }

      h1 {
        font-size: 22px;
      }

      main {
        padding: 0 12px;
        margin-top: 18px;
      }

      .info {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="wrap">
    <a class="back" href="/admin/">← Kembali ke Admin DKD PPU</a>

    <h1>DATA PELAKU SENI &amp; BUDAYA</h1>

    <div class="subtitle">
      Data pendataan yang tersimpan pada sistem DKD PPU
    </div>
  </div>
</header>

<main>

  <div class="info">
    <strong>Sumber Data:</strong> Database D1 DKD PPU

    <div id="statusMessage" class="status-message loading">
      Memuat data pendataan...
    </div>
  </div>

  <div class="table-box">
    <div class="table-scroll">

      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Nomor Pendataan</th>
            <th>Nama Individu / Group</th>
            <th>Kategori</th>
            <th>Jenis Pelaku</th>
            <th>Bidang Seni</th>
            <th>Kecamatan</th>
            <th>Desa / Kelurahan</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="dataBody">
          <tr>
            <td colspan="9" class="kosong">
              Memuat data...
            </td>
          </tr>
        </tbody>

      </table>

    </div>
  </div>

</main>

<script>

async function loadData() {

  const statusMessage =
    document.getElementById("statusMessage");

  const dataBody =
    document.getElementById("dataBody");

  try {

    statusMessage.className =
      "status-message loading";

    statusMessage.textContent =
      "Memuat data dari database D1...";

    const response = await fetch("/api/pendataan", {
      method: "GET",
      credentials: "include",
      headers: {
        "Accept": "application/json"
      }
    });

    if (response.status === 401) {

      statusMessage.className =
        "status-message error";

      statusMessage.textContent =
        "Sesi admin tidak tersedia. Silakan login kembali.";

      dataBody.innerHTML = `
        <tr>
          <td colspan="9" class="kosong">
            Sesi admin tidak tersedia.
          </td>
        </tr>
      `;

      return;
    }

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }

    const result = await response.json();

    /*
     * Worker dapat mengembalikan array langsung
     * atau object yang memiliki properti data.
     */
    const data = Array.isArray(result)
      ? result
      : (Array.isArray(result.data) ? result.data : []);

    if (!data.length) {

      statusMessage.className =
        "status-message";

      statusMessage.textContent =
        "Belum ada data pendataan.";

      dataBody.innerHTML = `
        <tr>
          <td colspan="9" class="kosong">
            Belum ada data pelaku seni dan budaya.
          </td>
        </tr>
      `;

      return;
    }

    statusMessage.className =
      "status-message";

    statusMessage.textContent =
      "Berhasil memuat " +
      data.length +
      " data dari D1.";

    dataBody.innerHTML = "";

    data.forEach((item, index) => {

      const tr =
        document.createElement("tr");

      const status =
        item.status || "-";

      let statusClass = "";

      if (status === "MENUNGGU VERIFIKASI") {
        statusClass = "menunggu";
      }
      else if (status === "TERVERIFIKASI") {
        statusClass = "terverifikasi";
      }
      else if (status === "DIPUBLIKASIKAN") {
        statusClass = "dipublikasikan";
      }
      else if (status === "DITOLAK") {
        statusClass = "ditolak";
      }

      tr.innerHTML = `

        <td>${index + 1}</td>

        <td class="id">
          ${escapeHtml(item.id_pendataan || "-")}
        </td>

        <td class="name">
          ${escapeHtml(item.nama_individu_group || "-")}
        </td>

        <td>
          ${escapeHtml(item.kategori || "-")}
        </td>

        <td>
          ${escapeHtml(item.jenis_pelaku || "-")}
        </td>

        <td>
          ${escapeHtml(item.bidang_seni || "-")}
        </td>

        <td>
          ${escapeHtml(item.kecamatan || "-")}
        </td>

        <td>
          ${escapeHtml(item.desa_kelurahan || "-")}
        </td>

        <td>
          <span class="badge ${statusClass}">
            ${escapeHtml(status)}
          </span>
        </td>

      `;

      dataBody.appendChild(tr);

    });

  }
  catch (error) {

    console.error(error);

    statusMessage.className =
      "status-message error";

    statusMessage.textContent =
      "Gagal mengambil data dari database D1.";

    dataBody.innerHTML = `
      <tr>
        <td colspan="9" class="kosong">
          Gagal memuat data.
          Silakan periksa sesi login Admin.
        </td>
      </tr>
    `;

  }

}


/* Pengaman tampilan teks dari database */
function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


loadData();

</script>

</body>
</html>
