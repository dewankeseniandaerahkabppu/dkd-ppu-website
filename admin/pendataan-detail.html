  <script>


    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }



    /* =========================
       VERIFIKASI
    ========================= */

    async function verifikasiData() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const id =
        params.get("id");

      if (!id) {

        alert(
          "Nomor pendataan tidak ditemukan."
        );

        return;

      }

      if (!confirm(
        "Apakah data ini benar-benar akan diverifikasi?"
      )) {

        return;

      }

      try {

        const response =
          await fetch(
            "/api/pendataan/verifikasi",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                id_pendataan: id
              })
            }
          );

        const result =
          await response.json();

        if (!response.ok || !result.ok) {

          throw new Error(
            result.error ||
            "Verifikasi gagal."
          );

        }

        alert(
          "Data berhasil diverifikasi."
        );

        window.location.reload();

      } catch (error) {

        alert(
          "Gagal memverifikasi data:\n\n" +
          error.message
        );

      }

    }

          },

          body: JSON.stringify({
            id_pendataan: id
          })
        }
      );

    const result =
      await response.json();

    if (!response.ok || !result.ok) {

      throw new Error(
        result.error ||
        "Verifikasi ulang gagal."
      );

    }

    alert(
      "Data berhasil dikembalikan ke tahap MENUNGGU VERIFIKASI."
    );

    window.location.reload();

  } catch (error) {

    alert(
      "Gagal melakukan verifikasi ulang:\n\n" +
      error.message
    );

  }

}



    /* =========================
       LOAD DETAIL
    ========================= */

    async function loadDetail() {

      const hasil =
        document.getElementById("hasil");

      const params =
        new URLSearchParams(
          window.location.search
        );

      const id =
        params.get("id");

      if (!id) {

        hasil.innerHTML = `

          <div class="error">

            Nomor pendataan tidak ditemukan.

          </div>

        `;

        return;

      }


      try {

        const response =
          await fetch(
            "/api/pendataan?id=" +
            encodeURIComponent(id)
          );

        const result =
          await response.json();

        if (!response.ok || !result.ok) {

          throw new Error(
            result.error ||
            "Data tidak dapat ditemukan."
          );

        }

        const item =
          result.data;

        if (!item) {

          throw new Error(
            "Data pendataan tidak ditemukan."
          );

        ========================= */

          statusClass =

          item.status ===

    loadDetail();
